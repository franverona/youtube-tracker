name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config while dependency code runs.
          persist-credentials: false
          # Full history, so the main-ancestry check below can see origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # WXT takes the manifest version from package.json, so the tag must match it.
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      # Only release commits that landed on main (and so passed CI there).
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: pnpm run test && pnpm run type-check

      - run: pnpm run zip && pnpm run zip:firefox

      - run: gh release create "$GITHUB_REF_NAME" .output/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
