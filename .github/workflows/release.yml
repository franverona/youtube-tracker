name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config while dependency code runs.
          persist-credentials: false
          # Full history, so the main-ancestry check below can see origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # WXT takes the manifest version from package.json, so the tag must match it.
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      # Only release commits that landed on main (and so passed CI there).
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: pnpm run test && pnpm run type-check

      - run: pnpm run zip && pnpm run zip:firefox

      # Re-runnable: a failed attempt may already have created the release.
      - run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .output/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" .output/*.zip --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
