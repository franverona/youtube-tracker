name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  # No paths-ignore: "Type check & build" is a required check, so it must
  # report on every PR or docs-only PRs could never merge.
  pull_request:
    # `edited` so fixing a PR title re-runs the title check.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config while dependency code runs.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Squash merges use the PR title as the commit on main, which the local
      # commit-msg hook never sees.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

      - run: pnpm run test

      - run: pnpm run type-check

      - run: pnpm run lint

      - run: pnpm run format:check

      # zip builds first, so this also covers what release.yml ships
      # (including the Firefox sources zip).
      - run: pnpm run zip

      - run: pnpm run zip:firefox
